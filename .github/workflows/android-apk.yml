name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: bun install

      - name: Build Web Application Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bunx vite build --outDir dist

      - name: Initialize Capacitor Configuration (Fallback)
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            bun add @capacitor/core @capacitor/cli @capacitor/android
            bunx cap init "LibraryOS" "app.lovable.libraryos" --web-dir=dist
          fi

      - name: Ensure Android Native Platform Layout
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Grant Gradle Execute Permissions
        run: chmod +x android/gradlew

      - name: Compile Unsigned Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: LibraryOS-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
