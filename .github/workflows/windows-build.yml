name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install

      - name: Build Web Application Assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bunx vite build --outDir dist

      # We use Electron-Packager here as a quick, zero-config way to turn any web folder into an EXE
      - name: Package Windows Executable
        run: |
          bun add -d electron electron-packager
          npx electron-packager . LibraryOS --platform=win32 --arch=x64 --out=dist-win --overwrite

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibraryOS-windows-exe
          path: dist-win/
